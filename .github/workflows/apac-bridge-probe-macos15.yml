# =============================================================================
# THROWAWAY PROBE -- this is NOT part of the shipped apac-bridge recipe and must
# never be folded into it.  One question, one run: does the GitHub-hosted
# `macos-15` image still exist, and does Apple's system APAC decoder (pinned
# fourMs/apac-decode @ 733f9fbc) reproduce the proven reference sample_foa.caf on
# it?  Readings leave the runner ONLY as ::notice::/::warning:: annotations,
# because the reader has no API token:
#   GET /repos/luoye-cpu/3FCompare/check-runs/<job_id>/annotations
# Deleting this file is the intended cleanup once the answer has been read.
# =============================================================================
# WHY A SECOND JOB:  if the macos-15 leg dies for any reason (label gone, job
# never scheduled, AVFoundation with no APAC decoder, image differences), a red
# leg alone is ambiguous.  `control26` runs the identical steps on the known-good
# image the same day, so the run always yields a baseline to attribute to.
# NO artifacts, NO results branch, NO contents:write -- none of it is readable
# without a token, so all signal goes into the annotation channel.
# =============================================================================

name: apac-bridge probe macos-15 (throwaway)

on:
  push:
    branches:
      - apac-bridge
    paths:
      - .github/workflows/apac-bridge-probe-macos15.yml

permissions:
  contents: read

env:
  # decoder pin, copied verbatim from the shipped recipe
  APAC_DECODE_REPO: https://github.com/fourMs/apac-decode.git
  APAC_DECODE_SHA: 733f9fbc8529be79b83f1ea9162e5470e1d89772
  # single input, already committed on branch apac-bridge
  IN: samples/sample.MOV
  IN_BYTES: 14786195
  IN_MD5: cc78227a5c08ecf2a653e667d81f3018
  # output we expect to reproduce
  OUT_CAF: probe-out/sample_foa.caf
  REF_BYTES: 1569536
  REF_MD5: 63f5c13b5b3d4e20ef8bf97d93151713
  REF_PCM_BYTES: 1174080
  # local reference for the pinned blob we execute (decode-apac.swift)
  TOOL_SHA256: 2a0f99eb18d099106a4d8227cf4088034f8820eba2feb966719b8b37fd0a49b4

jobs:
  probe15:
    name: probe macos-15 (throwaway)
    runs-on: macos-15
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write     # only this leg pushes its caf back, so the byte-level delta can
                          # be measured locally with proven readers instead of a parser
                          # invented on a runner nobody can debug. md5 a0413aaf... identifies it.
    env:
      P: probe15
      LABEL: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: decode and report
        run: |
          # errexit is ON by default in the runner's bash wrapper; this probe must
          # keep going past the first failure so the readings still get emitted.
          set +e
          # annotations travel through a markdown-ish channel: keep one line,
          # ASCII only, no tab, no '<', no '|', no '%'.
          san() { LC_ALL=C tr -cd 'A-Za-z0-9 ._=/:,-' | tr -s ' ' | cut -c1-150; }
          note() { echo "::notice::${P} $1"; }
          warn() { echo "::warning::${P} $1"; }

          # (a) what image did we actually land on
          os=$(sw_vers -productVersion 2>/dev/null | san)
          bld=$(sw_vers -buildVersion 2>/dev/null | san)
          mach=$(uname -m 2>/dev/null | san)
          swiftv=$(swift --version 2>&1 | head -1 | san)
          note "image label=${LABEL} os_version=${os:-none} os_build=${bld:-none} arch=${mach:-none} swift=${swiftv:-none}"

          # (b) is the input the file we think it is
          ibytes=$(stat -f%z "$IN" 2>/dev/null)
          imd5=$(md5 -q "$IN" 2>/dev/null)
          if [ "$imd5" = "$IN_MD5" ]; then iv=INPUT_MATCH; else iv=INPUT_DIFFER; fi
          note "input bytes=${ibytes:-none} expect_bytes=${IN_BYTES} md5=${imd5:-none} ref_md5=${IN_MD5} ${iv}"

          # (c) the decoder clone, pinned exactly like the shipped recipe
          git clone --quiet "$APAC_DECODE_REPO" apac-decode 2> clone.err
          clone_rc=$?
          git -C apac-decode checkout --quiet --detach "$APAC_DECODE_SHA" 2>> clone.err
          co_rc=$?
          got=$(git -C apac-decode rev-parse HEAD 2>/dev/null | san)
          tool=$(shasum -a 256 apac-decode/decode-apac.swift 2>/dev/null | cut -d' ' -f1)
          if [ -z "$tool" ]; then tv=TOOL_ABSENT
          elif [ "$tool" = "$TOOL_SHA256" ]; then tv=TOOL_MATCH
          else tv=TOOL_DIFFER
          fi
          note "tool clone_rc=${clone_rc} checkout_rc=${co_rc} head=${got:-none} expect_head=${APAC_DECODE_SHA} tool_sha256=${tool:-none} ref_tool_sha256=${TOOL_SHA256} ${tv}"
          if [ "$tv" != "TOOL_MATCH" ]; then
            warn "tool_unpinned clone_rc=${clone_rc} checkout_rc=${co_rc} err=$(head -3 clone.err | san)"
          fi

          # (d) did Apple's decoder run at all, and with what exit status
          mkdir -p probe-out
          t0=$(date +%s)
          swift apac-decode/decode-apac.swift "$IN" "$OUT_CAF" > decode.out 2> decode.err
          rc=$?
          t1=$(date +%s)
          cafyes=no
          [ -f "$OUT_CAF" ] && cafyes=yes
          note "decode rc=${rc} elapsed_s=$((t1 - t0)) caf_present=${cafyes} out_caf=${OUT_CAF} swift_present=$(command -v swift >/dev/null 2>&1 && echo yes || echo no)"

          # (e) the .caf if it appeared
          cbytes=$(stat -f%z "$OUT_CAF" 2>/dev/null)
          cmd5=$(md5 -q "$OUT_CAF" 2>/dev/null)
          note "caf bytes=${cbytes:-none} expect_bytes=${REF_BYTES} md5=${cmd5:-none} ref_md5=${REF_MD5} ref_pcm_bytes=${REF_PCM_BYTES}"

          # (f) THE ANSWER: is it byte-identical to the proven reference
          if [ -n "$cmd5" ] && [ "$cmd5" = "$REF_MD5" ]; then
            note "VERDICT MATCH apac decoder reproduced the reference on ${LABEL}"
          elif [ -n "$cmd5" ]; then
            warn "VERDICT DIFFER output md5 differs from the proven reference on ${LABEL}"
          elif [ "$rc" != 0 ]; then
            warn "VERDICT NO_CAF rc=${rc} decoder produced nothing on ${LABEL} err_tail=$(tail -3 decode.err | san)"
          else
            warn "VERDICT NO_CAF rc=0 but no output file on ${LABEL} err_tail=$(tail -3 decode.err | san)"
          fi
          touch ".done.${P}"
          exit 0

      - name: backstop (only fires if the step above died)
        if: always()
        run: |
          set +e
          [ -f ".done.${P}" ] && exit 0
          echo "::warning::${P} VERDICT ABORTED reporting step died before the verdict, os=$(sw_vers -productVersion 2>/dev/null) arch=$(uname -m 2>/dev/null)"
          exit 0

      # Push the macos-15 caf to a probe-only branch so the byte-level difference can be
      # measured locally by the readers that are already proven, instead of by a CAF parser
      # written inside a job nobody can debug. Untracked files survive `git rm -rf .`, but
      # the copy to ../ is done first anyway, mirroring the shipped recipe's push-back job.
      - name: push the macos-15 caf for local byte analysis
        if: always()
        run: |
          set +e
          [ -f "$OUT_CAF" ] || { echo "::warning::${P} push_skipped no caf on disk"; exit 0; }
          cp "$OUT_CAF" ../m15.caf || { echo "::warning::${P} push_skipped copy failed"; exit 0; }
          git config user.name "apac-bridge-probe"
          git config user.email "apac-bridge-probe@users.noreply.github.com"
          br="apac-probe-m15-${GITHUB_RUN_ID}"
          git checkout --orphan "$br" >/dev/null 2>&1
          git rm -rf --quiet . >/dev/null 2>&1
          mkdir -p probe && cp ../m15.caf probe/sample_macos15.caf
          git add -f probe
          git commit -q -m "macos-15 APAC probe decode (run ${GITHUB_RUN_ID}, decoder ${APAC_DECODE_SHA})"
          git push -f origin "HEAD:refs/heads/${br}" >/dev/null 2>&1
          prc=$?
          echo "::notice::${P} push rc=${prc} branch=${br} file=probe/sample_macos15.caf md5=$(md5 -q ../m15.caf) bytes=$(stat -f%z ../m15.caf)"
          exit 0

  control26:
    name: control macos-26 (throwaway baseline)
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true
    env:
      P: control26
      LABEL: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: decode and report
        run: |
          set +e
          san() { LC_ALL=C tr -cd 'A-Za-z0-9 ._=/:,-' | tr -s ' ' | cut -c1-150; }
          note() { echo "::notice::${P} $1"; }
          warn() { echo "::warning::${P} $1"; }

          os=$(sw_vers -productVersion 2>/dev/null | san)
          bld=$(sw_vers -buildVersion 2>/dev/null | san)
          mach=$(uname -m 2>/dev/null | san)
          swiftv=$(swift --version 2>&1 | head -1 | san)
          note "image label=${LABEL} os_version=${os:-none} os_build=${bld:-none} arch=${mach:-none} swift=${swiftv:-none}"

          ibytes=$(stat -f%z "$IN" 2>/dev/null)
          imd5=$(md5 -q "$IN" 2>/dev/null)
          if [ "$imd5" = "$IN_MD5" ]; then iv=INPUT_MATCH; else iv=INPUT_DIFFER; fi
          note "input bytes=${ibytes:-none} expect_bytes=${IN_BYTES} md5=${imd5:-none} ref_md5=${IN_MD5} ${iv}"

          git clone --quiet "$APAC_DECODE_REPO" apac-decode 2> clone.err
          clone_rc=$?
          git -C apac-decode checkout --quiet --detach "$APAC_DECODE_SHA" 2>> clone.err
          co_rc=$?
          got=$(git -C apac-decode rev-parse HEAD 2>/dev/null | san)
          tool=$(shasum -a 256 apac-decode/decode-apac.swift 2>/dev/null | cut -d' ' -f1)
          if [ -z "$tool" ]; then tv=TOOL_ABSENT
          elif [ "$tool" = "$TOOL_SHA256" ]; then tv=TOOL_MATCH
          else tv=TOOL_DIFFER
          fi
          note "tool clone_rc=${clone_rc} checkout_rc=${co_rc} head=${got:-none} expect_head=${APAC_DECODE_SHA} tool_sha256=${tool:-none} ref_tool_sha256=${TOOL_SHA256} ${tv}"
          if [ "$tv" != "TOOL_MATCH" ]; then
            warn "tool_unpinned clone_rc=${clone_rc} checkout_rc=${co_rc} err=$(head -3 clone.err | san)"
          fi

          mkdir -p probe-out
          t0=$(date +%s)
          swift apac-decode/decode-apac.swift "$IN" "$OUT_CAF" > decode.out 2> decode.err
          rc=$?
          t1=$(date +%s)
          cafyes=no
          [ -f "$OUT_CAF" ] && cafyes=yes
          note "decode rc=${rc} elapsed_s=$((t1 - t0)) caf_present=${cafyes} out_caf=${OUT_CAF} swift_present=$(command -v swift >/dev/null 2>&1 && echo yes || echo no)"

          cbytes=$(stat -f%z "$OUT_CAF" 2>/dev/null)
          cmd5=$(md5 -q "$OUT_CAF" 2>/dev/null)
          note "caf bytes=${cbytes:-none} expect_bytes=${REF_BYTES} md5=${cmd5:-none} ref_md5=${REF_MD5} ref_pcm_bytes=${REF_PCM_BYTES}"

          if [ -n "$cmd5" ] && [ "$cmd5" = "$REF_MD5" ]; then
            note "VERDICT MATCH apac decoder reproduced the reference on ${LABEL}"
          elif [ -n "$cmd5" ]; then
            warn "VERDICT DIFFER output md5 differs from the proven reference on ${LABEL}"
          elif [ "$rc" != 0 ]; then
            warn "VERDICT NO_CAF rc=${rc} decoder produced nothing on ${LABEL} err_tail=$(tail -3 decode.err | san)"
          else
            warn "VERDICT NO_CAF rc=0 but no output file on ${LABEL} err_tail=$(tail -3 decode.err | san)"
          fi
          touch ".done.${P}"
          exit 0

      - name: backstop (only fires if the step above died)
        if: always()
        run: |
          set +e
          [ -f ".done.${P}" ] && exit 0
          echo "::warning::${P} VERDICT ABORTED reporting step died before the verdict, os=$(sw_vers -productVersion 2>/dev/null) arch=$(uname -m 2>/dev/null)"
          exit 0
