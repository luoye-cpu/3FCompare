# =============================================================================
# apac-bridge.yml  --  Apple APAC -> FOA bridge
# First run: 2026-10-04, luoye-cpu/3FCompare @ branch apac-bridge. It FAILED on a
# missing actions/checkout step (the bug the step below now documents); the recipe
# has been run green since. Receipt: out/run-2026-10-04.md
# =============================================================================
# WHAT THIS DOES
#   On a GitHub-hosted macOS runner, uses Apple's OWN system decoder (driven by
#   fourMs/apac-decode's single-file decode-apac.swift) to turn original APAC
#   .mov captures into 4-channel FOA (first-order ambisonics) PCM:
#       <name>.mov  ->  <name>_foa.caf (float32 @ source rate)  ->  <name>_foa.wav
#
# WHY A RUNNER AT ALL  (verified, do not re-litigate)
#   decode-apac.swift calls AVFoundation -> Apple's system APAC decoder, which
#   needs macOS 15+.  There is NO Windows-side bitstream decoder: upstream
#   FFmpeg only RECOGNISES the codec (`..A.L. apple_apac`, no `D` flag), and the
#   `A....D apac  Marian's A-pac audio` line in `-decoders` is a NAME COLLISION
#   with an unrelated codec, not Apple's.
#
# RUNNER IMAGE
#   Pinned to `macos-26` = the ONLY image we have actually proven on this project:
#   the run that produced our reference artefacts used it (see
#   ..\APAC_BRIDGE_NOTES.md line 9, which also records "APAC 解码工具要求 macOS 26 镜像").
#   `decode-apac.swift` declares a macOS 15 deployment floor, but a floor is not a
#   working image.  `macos-15` HAS now been run (throwaway probe, run 37159937543):
#   the pinned decoder exits 0 and writes a structurally valid 4ch/48kHz CAF whose
#   payload is 1,565,440 ZERO bytes - silence.  So this pin is not conservatism, it
#   is load-bearing: lowering it yields a green run and an empty sound field, which
#   is exactly what the silence gate below is there to catch.  `macos-14` has never
#   been run.  If macos-26 is ever renamed, RAISE the pin to the newest macOS image
#   and re-prove it against a reference .caf -- never lower it.
#
# PROVENANCE PIN
#   fourMs/apac-decode @ 733f9fbc8529be79b83f1ea9162e5470e1d89772 (MIT), single
#   file decode-apac.swift.  Step "Pin the decoder source" fails closed if the
#   clone does not land on that commit, so a silent upstream change cannot slip
#   into an artefact that this recipe calls reproducible.
#
# INPUT RULE -- READ THIS BEFORE YOU COMMIT ANYTHING TO bridge-in/
#   Upload ORIGINAL files only.  A remux/cut is not a smaller input, it is a
#   broken input: ffmpeg `-c copy` of an APAC .mov keeps the `apac` fourcc but
#   DROPS the nested `dapa` config box (measured on this box: stsd `apac` entry
#   225 B with a 133 B `dapa` child -> 56 B, raw scan for `dapa` NOT FOUND), so
#   the decoder is left without its configuration.  Consequences:
#     * never `ffmpeg -c copy` / `-ss` / `-t` an original to make a "small
#       regression fixture" -- there is no cheap fixture, use the whole original;
#     * never delete an original after bridging -- it is the only copy of the
#       encoded sound field.
#
# FILE LAYOUT THIS WORKFLOW EXPECTS (repo root = your repo)
#   .github/workflows/apac-bridge.yml        this file
#   bridge-in/inputs.tsv                     md5 manifest, same 12-column schema
#                                            as bridge2/inputs.tsv; the gate reads
#                                            role + relpath + bytes + md5 and
#                                            requires role == "apac_in"
#   bridge-in/<file>.mov                     the originals listed there
#
# HOW TO RUN
#   1. put this file at .github/workflows/apac-bridge.yml in a repo
#   2. put the originals in bridge-in/ and a manifest row per original in
#      bridge-in/inputs.tsv   (tab-separated; see bridge2/inputs.tsv for the
#      exact 12 columns -- copy those rows and edit role to apac_in)
#   3. compute md5 ON THE ORIGINAL with something that reports only the digest
#      (Windows: `py -c "import hashlib;print(hashlib.file_digest(open(F,'rb'),
#      'md5').hexdigest())"`).  Do NOT trust a bare `md5sum` line under MSYS for
#      Windows paths -- it prefixes the path and yields false mismatches.
#   4. commit + push to a branch matching the `push:` trigger below.  The push IS
#      the trigger: no web click, no token (run 37152363565 finished in 91 s).
#   5. `git fetch` the results branch that push-back commits, apac-results-<run_id>.
#      The artifact upload is there too, but reading an artifact needs an API token,
#      so the branch -- not the artifact -- is the route a tokenless caller can use.
#   Public-repo standard runners (incl. macOS) are free; the proven run took
#   minutes.  On a PRIVATE repo macOS minutes are metered -- think first.
# =============================================================================
# RUN VARIANT installed on luoye-cpu/3FCompare @ branch apac-bridge.
# Canonical recipe: spatial-samples/apple/bridge2/apac-bridge.yml, plus the deltas
# listed in bridge-in/VARIANT.diff.txt (V1 INDIR=samples because the originals are
# already committed under samples/, V3 paths += samples/**, V4 this block).
# Nothing else was edited.  Everything else is byte-identical.
# =============================================================================

name: APAC -> FOA bridge

on:
  workflow_dispatch:
    inputs:
      push_results_back:
        description: "also commit the FOA outputs to a results branch (the zero-token route we used)"
        type: boolean
        default: false
  push:
    branches: [apac-bridge]
    paths:
      - "bridge-in/**"
      - "samples/**"
      - ".github/workflows/apac-bridge.yml"

permissions:
  contents: read          # flip to `contents: write` only for the push-back route,
                          # which the optional job below requests via its own block.

concurrency:
  group: apac-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  APAC_DECODE_REPO: https://github.com/fourMs/apac-decode.git
  APAC_DECODE_SHA: 733f9fbc8529be79b83f1ea9162e5470e1d89772
  MANIFEST: bridge-in/inputs.tsv
  INDIR: samples            # VARIANT V1: originals already committed here
  OUTDIR: apac-foa-out

jobs:
  bridge:
    name: decode on macOS (Apple system decoder)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # This step is NOT optional. Without it the workspace is EMPTY and every
      # step that reads a committed file (the manifest gate, the decode loop)
      # fails on its own input - which is exactly how run 37152096189 died.
      - uses: actions/checkout@v4
      - name: Show the pin this run is held to
        run: |
          echo "decoder    : $APAC_DECODE_REPO @ $APAC_DECODE_SHA"
          echo "runner     : $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "manifest   : $MANIFEST"
          echo "The macOS image must be 15 or newer for AVFoundation to own an APAC decoder."

      # ---- gate 1: the decoder source is exactly the audited commit ----------
      - name: Pin the decoder source (fails closed on any upstream drift)
        run: |
          set -euo pipefail
          git clone --quiet "$APAC_DECODE_REPO" apac-decode
          git -C apac-decode checkout --quiet --detach "$APAC_DECODE_SHA"
          got="$(git -C apac-decode rev-parse HEAD)"
          echo "clone HEAD = $got"
          if [ "$got" != "$APAC_DECODE_SHA" ]; then
            echo "::error::decoder clone landed on $got, expected $APAC_DECODE_SHA"; exit 1
          fi
          test -f apac-decode/decode-apac.swift
          echo "--- file we are about to execute ---"
          ls -l apac-decode/decode-apac.swift
          shasum -a 256 apac-decode/decode-apac.swift
          head -12 apac-decode/decode-apac.swift   # its own header: usage + W,Y,Z,X note
          # Local reference: the copy vendored on the bridging box is byte-identical
          # to this file after CRLF->LF normalisation (bridge2 check D1).

      # ---- gate 2: inputs are the originals we say they are ------------------
      - name: Checksum gate on the APAC inputs (md5 manifest)
        run: |
          set -euo pipefail
          test -f "$MANIFEST" || { echo "::error::missing $MANIFEST"; exit 1; }
          # 12-column tab-separated manifest, same schema as bridge2/inputs.tsv:
          # role relpath bytes md5 container_stream channels sample_rate
          # bit_depth frames duration_s acn_verified verification_method
          awk -F'\t' 'NR>1 && $1=="apac_in" {print $2"\t"$3"\t"$4}' "$MANIFEST" \
            > gate.tsv
          n=0
          while IFS=$'\t' read -r rel bytes md5; do
            n=$((n+1))
            f="$INDIR/$(basename "$rel")"
            test -f "$f" || { echo "::error::$f not committed (upload the ORIGINAL)"; exit 1; }
            got_bytes=$(stat -f%z "$f")
            got_md5=$(openssl dgst -md5 "$f" | sed 's/.*= *//')
            echo "$f  bytes=$got_bytes (manifest $bytes)  md5=$got_md5 (manifest $md5)"
            [ "$got_bytes" = "$bytes" ] || { echo "::error::$f size mismatch"; exit 1; }
            [ "$got_md5" = "$md5" ]     || { echo "::error::$f md5 mismatch"; exit 1; }
            # cheap "is this still an original" probe: the dapa config box must be
            # present, because a -c copy remux silently drops it.
            if ! grep -qa dapa "$f"; then
              echo "::error::$f has no 'dapa' config box -> this is a remux, not an original"
              exit 1
            fi
          done < gate.tsv
          echo "gate passed for $n input(s)"

      # ---- decode ------------------------------------------------------------
      - name: Run Apple's decoder over the manifest input list
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          awk -F'\t' 'NR>1 && $1=="apac_in" {print $2}' "$MANIFEST" | while IFS= read -r rel; do
            src="$INDIR/$(basename "$rel")"
            stem=$(basename "$src"); stem="${stem%.*}"
            echo "===== $src -> $OUTDIR/${stem}_foa.caf"
            # interpreter form, exactly as upstream documents:
            #   swift decode-apac.swift input.mov output.caf
            # pipefail is on, so a decoder failure fails the step even though the
            # output is piped through tee; the shape gate below is a second,
            # independent net that does not trust the exit status at all.
            swift apac-decode/decode-apac.swift "$src" "$OUTDIR/${stem}_foa.caf" 2>&1 | tee -a "$OUTDIR/${stem}_decode.log"
          done
          ls -l "$OUTDIR"

      # ---- gate 3: the outputs are the shape the recipe promises -------------
      - name: Shape gate (4 channels, 48 kHz, and a FOA-shaped frame count)
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null 2>&1 || brew install ffmpeg
          shopt -s nullglob
          caf=("$OUTDIR"/*_foa.caf)
          [ ${#caf[@]} -gt 0 ] || { echo "::error::decoder produced no *_foa.caf"; exit 1; }
          for c in "${caf[@]}"; do
            echo "--- $c"
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,channels,sample_rate,bits_per_sample,duration \
              -of default=noprint_wrappers=1 "$c" | sed 's/^/    /'
            ch=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 "$c")
            sr=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "$c")
            [ "$ch" = "4" ] || { echo "::error::$ch channels, expected 4 (FOA first order)"; exit 1; }
            [ "$sr" = "48000" ] || echo "::warning::sample rate $sr, our reference set is 48000"
            # caf (float32) -> 24-bit wav, the artefact shape the plugin imports.
            stem=${c%.caf}
            ffmpeg -v error -y -i "$c" -c:a pcm_s24le "${stem}.wav"
          done
          ls -l "$OUTDIR"

      # ---- gate 4: the decode must contain signal, not just the right shape ----
      # A decode can be structurally perfect and completely empty.  The macos-15 probe
      # (run 37159937543) exited 0 and wrote a valid 4ch/48kHz CAF whose payload was
      # 1,565,440 zero bytes; gates 1-3 pass on that file, so silence needs its own net.
      - name: Silence gate (the FOA has to carry signal, not only the right shape)
        run: |
          # No set -e here on purpose: a gate that dies before it reports is useless
          # without a token to read the log with. Every operand goes out as an
          # annotation first, and only then does this step decide.
          set +e
          shopt -s nullglob
          caf=("$OUTDIR"/*_foa.caf)
          py=$(command -v python3 || echo none)
          echo "::notice::silence gate files=${#caf[@]} python3=${py} ffmpeg=$(command -v ffmpeg || echo none)"
          [ ${#caf[@]} -gt 0 ] || { echo "::error::no *_foa.caf to measure"; exit 1; }
          bad=0
          for c in "${caf[@]}"; do
            raw="$OUTDIR/$(basename "${c%.caf}").raw32"
            rm -f "$raw"
            ffmpeg -v error -y -i "$c" -f s32le "$raw"
            frc=$?
            tot=$(stat -f%z "$raw" 2>/dev/null || echo -1)
            nz=""
            method=none
            if [ "$py" != none ] && [ -s "$raw" ]; then
              nz=$("$py" -c 'import sys; d=open(sys.argv[1],\"rb\").read(); print(sum(1 for x in d if x))' "$raw" 2>/dev/null)
              [ -n "$nz" ] && method=python3
            fi
            if [ -z "$nz" ] && [ -s "$raw" ]; then
              nz=$(tr -d '\000' < "$raw" 2>/dev/null | wc -c)
              [ -n "$nz" ] && method="tr-octal000"
            fi
            echo "::notice::silence ${c##*/} ffmpeg_rc=${frc} raw_bytes=${tot} nonzero=${nz:-none} method=${method}"
            if [ "$frc" -ne 0 ] || [ "$tot" = "-1" ] || [ -z "$nz" ]; then
              echo "::error::cannot measure signal for $c (rc=${frc} size=${tot} nonzero=${nz:-none}) - failing closed rather than passing unchecked"; bad=1; continue
            fi
            if [ "$nz" -eq 0 ]; then
              echo "::error::$c is DIGITALLY SILENT: ${tot} B of linear PCM, every byte zero. The decoder exited ${frc} and made a well-formed file with no signal."; bad=1; continue
            fi
            awk -v n="$nz" -v t="$tot" -v f="${c##*/}" 'BEGIN{ r=(t>0? n/t : 0); if (r < 0.5) printf("::warning::silence %s only %.2f%% of bytes carry signal\n", f, 100*r); else printf("::notice::silence %s signal fraction %.2f%%\n", f, 100*r) }'
          done
          for r in "$OUTDIR"/*.raw32; do [ -f "$r" ] && rm -f "$r"; done
          [ "$bad" -eq 0 ] || { echo "::error::silence gate rejected at least one decode"; exit 1; }
          echo "::notice::silence gate passed for ${#caf[@]} file(s)"

      - name: Record what this run produced (digests for the manifest)
        run: |
          set -euo pipefail
          {
            echo "run: ${{ github.repository }}@${{ github.sha }}  run_id=${{ github.run_id }}"
            echo "runner: $(sw_vers -productName) $(sw_vers -productVersion)"
            echo "decoder: $APAC_DECODE_SHA"
            echo "# paste-ready rows for inputs.tsv -- BUT the relpath column is runner-relative: rewrite it to the path under apple\\ on the bridging box, and remember a fresh run is a NEW artefact (its md5 goes in a new row, it does not overwrite the proven reference rows)"
            find "$OUTDIR" -type f \( -name '*_foa.wav' -o -name '*_foa.caf' \) | sort | while read -r f; do
              printf 'foa_out\t%s\t%s\t%s\tpcm\t4\t48000\t%s\tn/a\tn/a\tsee bridge2/README.md\tsingle-run output, order fact transfers from the proven reference set\n' \
                "$f" "$(stat -f%z "$f")" "$(openssl dgst -md5 "$f" | sed 's/.*= *//')" \
                "$([ "${f##*.}" = wav ] && echo 24 || echo 32)"
            done
          } | tee "$OUTDIR/RUN_MANIFEST.tsv"

      # ---- publish -----------------------------------------------------------
      - name: Publish the FOA artefacts
        uses: actions/upload-artifact@v4
        with:
          name: apac-foa-artifacts
          path: |
            apac-foa-out/
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # THE ZERO-TOKEN ROUTE, AND IT IS THE ONE THAT RUNS BY DEFAULT
  # It used to be gated on the workflow_dispatch input alone, which is null on a
  # push event -> the job was skipped -> a caller with no API token got nothing
  # back at all, while every static check in the recipe stayed green.  A push to a
  # branch listed in `push:` now runs it (proven: run 37152363565, 91 s, gate D5).
  # The zero-token route we actually used the first time: no artifact download,
  # no API token, no web click.  Push a tag/branch -> this job runs on the macOS
  # runner -> it commits the decoded FOA files BACK to a results branch -> the
  # bridging box just `git fetch`es it.  Requirements:
  #   * the workflow needs `permissions: contents: write` (top of this file is
  #     `read`; the block below overrides it for this job only);
  #   * a push made with the built-in GITHUB_TOKEN does NOT recursively trigger
  #     workflows, which is what keeps this from looping;
  #   * on a public repo the standard macOS minutes are free.
  # Replay afterwards:
  #   git fetch origin 'refs/heads/apac-results-*:refs/remotes/origin/apac-results-*'
  #   git checkout -b local-results origin/apac-results-<GITHUB_RUN_ID>
  # ===========================================================================
  push-back:
    if: ${{ github.event_name == 'push' || github.event.inputs.push_results_back == 'true' }}
    needs: bridge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: main-repo
      - uses: actions/download-artifact@v4
        with:
          name: apac-foa-artifacts
          path: foa
      - name: Commit the FOA outputs to a per-run results branch
        run: |
          set -euo pipefail
          cd main-repo
          git config user.name "apac-bridge[bot]"
          git config user.email "apac-bridge@users.noreply.github.com"
          br="apac-results-${GITHUB_RUN_ID}"
          git checkout --orphan "$br"
          git rm -rf --quiet . || true
          mkdir -p apac_foa && cp -v ../foa/*_foa.wav ../foa/*_foa.caf apac_foa/
          cp -v ../foa/RUN_MANIFEST.tsv apac_foa/ 2>/dev/null || true
          git add -f apac_foa
          git commit -m "APAC->FOA bridge outputs (run ${GITHUB_RUN_ID}, decoder ${APAC_DECODE_SHA})"
          git push --force origin "$br"
